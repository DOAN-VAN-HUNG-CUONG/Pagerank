name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # PySpark is intentionally omitted: it is a 400+ MB download and its
        # tests skip automatically when it is absent. The reference engine,
        # mrjob, NetworkX/SciPy ground truth and the streaming pipeline are all
        # exercised here.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff networkx scipy matplotlib mrjob

      - name: Lint (ruff)
        run: ruff check python tools tests

      - name: Run tests
        run: pytest -v

      - name: Run slow tests
        run: pytest -v -m slow
